name: 推荐新剧
description: 推荐一部漏掉的红果漫剧 / AI 剧，标题填剧名即可提交
title: ""
labels: ["推荐"]
body:
  - type: markdown
    attributes:
      value: |
        ### 标题直接填剧名

        例如「咱家剑宗团宠小师妹」，带「第X季」也没关系。

        下面的字段**全部选填**，不知道就留空，直接点提交就行。

  - type: input
    id: seasons_eps
    attributes:
      label: 季数 / 集数
      description: 选填。例如「5 季」或「5 季，305/312/313/1000/780」
      placeholder: 5 季，305/312/313/1000/780
    validations:
      required: false

  - type: dropdown
    id: gender
    attributes:
      label: 频道
      description: 选填。平台不公开男女频，知道就选一个
      options:
        - 不确定
        - 男频
        - 女频
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他
      description: 选填。详情页链接、series_id、「第 6 季预约中」之类的补充
    validations:
      required: false
